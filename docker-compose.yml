services:
  postgres:
    image: postgres:16-alpine
    container_name: tickets-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets_db
    ports:
      - "5432:5432"
    volumes:
      - final_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickets_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  final_postgres_data:
    # Volume du conteneur final : doit exister (docker volume create final_postgres_data).
    external: true
