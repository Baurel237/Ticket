spring.application.name=ticket

# Conteneur final (docker-compose.yml à la racine) — surchargeable par variables d'environnement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tickets_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schéma géré par Flyway : Hibernate se contente de valider, jamais de
# modifier la base (aucune dérive de schéma en production).
spring.jpa.hibernate.ddl-auto=validate
# La table peut exister avant Flyway (base créée par ddl-auto=update
# historiquement) : elle est marquée comme baseline, puis les migrations
# suivantes s'appliquent normalement.
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false

server.port=8085

# Origines autorisées pour le frontend (serveur de développement Vite).
# 5173 et 5174 : Vite rebascule sur 5174 quand 5173 est occupé — sans cette
# entrée, les POST/PATCH du navigateur seraient rejetés en 403 (header Origin).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
